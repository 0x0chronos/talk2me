services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TALK2ME_DB: /state/database.sqlite
      TALK2ME_CACHE_DIR: /cache
      TALK2ME_CACHE_MB: "2048"
      TALK2ME_LOCAL_FALLBACK: "0"
      TALK2ME_HTTPS: "1"
      RCLONE_CONFIG: /credentials/rclone.conf
    volumes:
      - ./private/state:/state
      - ./private/cache:/cache
      - ./private/rclone:/credentials
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data: {}
  caddy_config: {}
